name: Update integrated HTML archive

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pvz-integrated-archive
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply incremental concept migration
        run: python tools/update_concept_v0_3_1.py

      - name: Build lossless integrated HTML
        run: python tools/build_archive.py

      - name: Commit generated documentation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md VERSIONING.md CHANGELOG.md docs tools PvZ-Infinite-Archive.html
          if git diff --cached --quiet; then
            echo "No archive or documentation changes."
            exit 0
          fi
          git commit -m "docs: update Concept v0.3.1 integrated archive [skip ci]"
          git push
