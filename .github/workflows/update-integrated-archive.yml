name: Update integrated HTML archive

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pvz-integrated-archive
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate maintenance scripts
        env:
          PYTHONPYCACHEPREFIX: /tmp/pvz-python-cache
        run: python -m py_compile tools/*.py

      - name: Apply Concept v0.4.0 gameplay migration
        run: python tools/update_concept_v0_4_0.py

      - name: Upgrade professional Master GDD to Concept v0.4.1
        run: python tools/update_master_gdd_v0_4_1.py

      - name: Restructure Master GDD directory for Concept v0.4.2
        run: python tools/restructure_master_gdd_v0_4_2.py

      - name: Upgrade archive Master GDD navigation
        run: python tools/update_archive_gdd_v0_4_1.py

      - name: Correct Fireseed Plan and TOC for Concept v0.4.3
        run: python tools/update_concept_v0_4_3.py

      - name: Build lossless integrated HTML and Pages entry
        run: python tools/build_archive.py

      - name: Commit generated documentation
        shell: bash
        run: |
          rm -rf tools/__pycache__
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .gitignore README.md VERSIONING.md CHANGELOG.md AGENT.md AGENTS.md docs tools index.html PvZ-Infinite-Archive.html
          if git diff --cached --quiet; then
            echo "No archive or documentation changes."
            exit 0
          fi
          git commit -m "docs: update Concept v0.4.3 Fireseed and TOC corrections [skip ci]"
          git push
